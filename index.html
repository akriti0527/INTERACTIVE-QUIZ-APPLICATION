<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz App</title>
  <link rel="stylesheet" href="style.css" /> <!--To link css file-->
</head>
<body>
  <div class="quiz-container">
    <h1>Quiz App</h1>
    <div id="question-container">
      <div id="question">Question text</div> <!--Question that appear -->
      <div id="answer-buttons" class="btn-container"></div><!--options that appear-->
    </div>
    <div class="controls">
      <button id="next-btn">Next</button>
    </div>
    <div id="score"></div>
  </div>

  <script src="script.js"></script><!--To link js file-->
</body>
</html>
